# push と Pull Request のたびにテストを動かす。モデルの重み・録音・動画は Git に入れていないので、
# それらがなくても動くテスト(合成データで確かめるもの)だけが対象になる
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Test
        run: python -m pytest -q
